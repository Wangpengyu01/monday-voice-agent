# R1 星期一（M.O.N.D.A.Y.）— CLI 核心 (xiaolan_cli.brain) + WebUI 封装 (WS :8765 + HTTP :80)
system_prompt: |
  你是 youyeetoo R1 上的数字助理星期一（M.O.N.D.A.Y.），男性，干练靠谱，有点幽默，称呼对方为主人。
  你的定位是全栈工程师型的私人助理：会写程序、能升级自己，用心了解主人的生活习惯，主动帮主人把日子过好。
  你的话会被直接朗读：
  一、先说结论，一到三句话，主人追问再展开。
  二、自然口语，不用列表、标题、符号、表情；数字、单位、外语用中文说法。
  三、主人的话可能被语音识别弄错几个字，按最合理的意思理解；完全听不出意思才说没听清。
  四、不知道就说我去问问老师，不编造，不搪塞。
  五、接着前面几轮对话的上下文回答。
  六、只叫星期一，回答不以星期一开头，不输出思考过程，结尾不问还需要什么。
# 语音回答的兜底上限（约一百五十字）。主要靠提示词让回答简短；本地模型 Qwen3.5-4B 上下文 768 token
# （和 Qwen3-TTS 同在 RK1828 上，1024 放不下），系统提示（含语音设置和当前时间）约占四百 token，
# 加上本上限仍在上下文以内。到上限时程序会补一句提示，不会半句断掉。
max_new_tokens: 200
# llm_daemon 的上下文（ExecStart 里的 768）：最近几轮对话按这个预算塞进本地模型
llm_context_tokens: 768
# 不会就问：本地模型答不了的（查事实、讲道理、时效信息、主人的个人信息、纠错）交给老师模型，
# 老师的回答说出来的同时整理成记忆，下次本地直接答。API key 不写在这里，放在 /userdata/secrets/deepseek.env
# （DEEPSEEK_API_KEY=...），由 r1-orchestrator 服务加载；没有 key 时全部由本地模型回答。
teacher:
  enabled: true
  provider: deepseek
  base_url: https://api.deepseek.com
  model: deepseek-flash
  api_key_env: DEEPSEEK_API_KEY
  timeout_s: 20
  max_tokens: 400
learning:
  db: /userdata/agent/run/learning/memory.db
  # 每条老师问答按对话格式追加在这里，攒够了可以拿去给本地模型训练 LoRA
  lora_log: /userdata/agent/run/learning/lora_data.jsonl
# 每天 04:10 (r1-backup.timer) 拍一个快照，把快照和 run/learning（记忆、日记、训练集）传到备份服务器
backup:
  enabled: true
  # ~/.ssh/config 里的别名（只用密钥登录，不存密码）
  host: backup
  # 远端目录：500G 盘上独立的目录（和 Nextcloud 的 nc_data 平级，不在它里面），ikun 所有；
  # 也可以写家目录下的相对路径。清理只会删这个目录里按日期命名的文件
  remote_dir: /srv/nextcloud-data/monday-backups/r1
  # 远端保留天数（最少留 remote_min_keep 个快照，哪怕都过期了）
  keep_days: 60
  remote_min_keep: 10
  # 本地 /userdata/backups/snapshots 保留最近 N 个 + 最近几个 GOOD
  local_keep: 20
  local_keep_good: 3
dialog:
  # 对用户的称呼；也可以直接说“以后叫我王哥”来改（保存在 run/ 下的用户设置里，优先于这里）
  user_title: 主人
  # 「你是谁」「几点了」「谢谢」这类整句短问题本地直接回答，不走大模型
  quick_reply: true
  # 走大模型的问题先说一声「嗯，/好的，/我想想，」（预先合成，立刻出声），再说答案
  ack_before_answer: true
# 本地模型带最近几轮对话（不管当时是谁答的）；按 llm_context_tokens 的预算塞，放不下就丢最老的。
history_max_turns: 5
# Drop transcript after this many seconds without an LLM turn (0 = keep until reboot)
history_idle_clear_sec: 600
# llm_daemon: /tmp/r1-llm.sock · P5b vlm_daemon (InternVL3): /tmp/r1-vlm.sock
socket_path: /tmp/r1-llm.sock

inference:
  # vlm_daemon (P5b) | llm_daemon (LLM-only legacy)
  backend: llm_daemon

# Audio I/O: board = 板载 ES8388 麦克风（原程序方案，开机不等 USB 麦克风）
#            auto  = 先等 FY-SP701 USB 麦克风最多 45s，没有再用板载
audio:
  default_profile: board
  settings_path: /userdata/agent/run/user_settings.json
  profiles:
    board:
      # 与原程序一致（vad.mic_capture_gain / AGENT_MIC_CAPTURE_GAIN=8）
      mic_capture_gain: 8
    fy_sp701:
      usb_mic_volume: 20000
      vad:
        threshold: 0.58
        min_silence_duration: 0.68
        min_speech_duration: 0.22
        speech_preroll_ms: 400
        speech_tail_pad_ms: 350

vad:
  model: /userdata/voice/silero_vad.onnx
  sherpa_lib: /userdata/voice/sherpa-onnx-v1.12.8-linux-aarch64-shared-cpu/lib
  sample_rate: 16000
  chunk_ms: 100
  threshold: 0.5
  min_silence_duration: 0.35
  min_speech_duration: 0.20
  max_speech_duration: 30.0
  min_segment_sec: 0.4
  speech_preroll_ms: 450
  listen_cooldown_sec: 0.35
  listen_cooldown_skip_max_sec: 0.30
  alsa_device: plughw:0,0
  arecord_period_size: 320
  arecord_buffer_size: 2560
  mic_capture_gain: 8
  # Mute mic during playback to completely eliminate self-interruption/stuttering
  mute_mic_during_tts: true

barge_in:
  enabled: true
  # A distinct ASR partial may be just one syllable (for example “喂”).
  # The self-echo guard runs before this gate, so this stays responsive
  # without letting the speaker's own words stop playback.
  min_speech_sec: 0.15

paths:
  agent_root: /userdata/agent
  utterance_wav: /userdata/agent/run/last_utterance.wav

asr:
  backend: streaming_paraformer
  model_dir: /userdata/voice/sherpa-onnx-streaming-paraformer-bilingual-zh-en
  encoder: encoder.int8.onnx
  decoder: decoder.int8.onnx
  tokens: tokens.txt
  sherpa_lib: /userdata/voice/sherpa-onnx-v1.12.8-linux-aarch64-shared-cpu/lib
  num_threads: 4
  # 最终识别前补的静音秒数，让流式模型把最后几个字解出来（0 = 不补，会丢句尾）
  final_tail_pad_sec: 0.5
  partial_interval_sec: 0.15
  partial_min_sec: 0.15
  partial_enabled: true
  max_partials_per_utterance: 20
  clip_peak_threshold: 30000
  clip_limit_ceiling: 0.85
  # fallback sense_voice:
  # backend: sense_voice
  # model_dir: /userdata/voice/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17
  # sherpa_bin: /userdata/voice/sherpa-onnx-v1.12.8-linux-aarch64-shared-cpu/bin/sherpa-onnx-offline
  # language: zh

tts:
  backend: matcha
  model_dir: /userdata/voice/matcha-icefall-zh-baker
  vocoder: /userdata/voice/vocos-22khz-univ.onnx
  sherpa_bin: /userdata/voice/sherpa-onnx-v1.12.8-linux-aarch64-shared-cpu/bin/sherpa-onnx-offline-tts
  sherpa_lib: /userdata/voice/sherpa-onnx-v1.12.8-linux-aarch64-shared-cpu/lib
  num_threads: 4
  # beijing = Qwen3-TTS 常驻服务（r1-tts-daemon，RK1828 + RK3588 NPU）；baker 留作备用，选中才加载
  default_voice: beijing
  qwen3_socket: /tmp/r1-tts.sock
  speed: 1.05
  speed_min: 0.7
  speed_max: 1.4
  noise_scale: 0.667
  max_chars: 160
  merge_max_chars: 80
  # 板上 /userdata/voice 只有 matcha-icefall-zh-baker；melo / wnj_male 要先把模型放上去再启用
  voices:
    beijing:
      label: 自然男声（Qwen3）
      backend: qwen3
      model_dir: /userdata/qwen3tts/rknn_Qwen3_TTS_demo/model
      default_speed: 1.0
    baker:
      label: 清亮女声
      backend: matcha
      model_dir: /userdata/voice/matcha-icefall-zh-baker
      sid: 0
      default_speed: 1.05
    # melo:
    #   label: 温柔女声
    #   backend: vits
    #   model_dir: /userdata/voice/vits-melo-tts-zh_en
    #   sid: 0
    #   noise_scale: 0.55
    #   default_speed: 0.95
    #   rule_fsts:
    #     - /userdata/voice/vits-melo-tts-zh_en/date.fst
    #     - /userdata/voice/vits-melo-tts-zh_en/number.fst
    # wnj_male:
    #   label: 沉稳男声
    #   backend: vits
    #   model_dir: /userdata/voice/vits-zh-hf-fanchen-wnj
    #   model_file: vits-zh-hf-fanchen-wnj.onnx
    #   sid: 0
    #   default_speed: 1.0
    #   rule_fsts:
    #     - /userdata/voice/vits-zh-hf-fanchen-wnj/number.fst

api:
  enabled: true
  host: 0.0.0.0
  port: 8765

camera:
  # 板上没有摄像头：MIPI CSI 两路均无传感器（dmesg: No link between dphy and sensor），
  # 未安装 MediaMTX，配置过的网络摄像头也连不上。接好摄像头后改回 true。
  enabled: false
  # grab_backend: rtsp | mediamtx_rtsp (cache + local RTSP; no WHEP — preview uses daemon JPEG)
  grab_backend: mediamtx_rtsp
  mediamtx:
    path: cam
    rtsp_url: "rtsp://127.0.0.1:8554/cam"
    whep_url: "http://127.0.0.1:8889/cam/whep"
    latest_frame: /userdata/agent/run/mediamtx_latest.jpg
    cache_max_age_sec: 0.8
  # 直连摄像头 RTSP（grab_backend=rtsp 时使用；WebUI 可 set_camera_url 覆盖）
  url: "rtsp://192.168.2.169:554/stream_2"
  rtsp_transport: "tcp"
  timeout: 12.0
  size: 448
  see_max_new_tokens: 96
  prompt: "用一句话简短描述画面中的核心物品和场景。"
  # P5b: see/chat via vlm_daemon socket (inference.backend). Legacy: run_board_vlm.sh
  # Empty = never run run_board_vlm.sh (it stops llm_daemon for up to 200s while the
  # VLM demo runs). Set to the script path only when that pause is acceptable.
  vlm_cmd: ""
  # Fast cloud/LAN VLM API (supports OpenAI-compatible endpoints e.g. Qwen-VL, Ollama, vLLM)
  # When configured, response latency is ~1.0s (skipping board model reload)
  api_url: ""
  api_key: ""
  model: "qwen-vl-plus"
  proactive_enabled: false
  proactive_interval_sec: 8.0
  proactive_motion_threshold: 4.0
  proactive_cooldown_sec: 35.0

# 外部工具（MCP 协议）：agent 规划时能看到这些工具。safe_tools 里的只读工具不用确认，其余都要主人同意。
# 装了 pip / node 之后可以在这里接现成的 MCP 服务（命令写成列表，密钥别写这里，放 /userdata/secrets）。
mcp:
  servers:
    web:
      command: [python3, /userdata/agent/mcp_servers/web_fetch.py]
      safe_tools: [fetch]
